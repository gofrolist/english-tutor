app = "english-tutor"
primary_region = "lax"

[env]
  DEBUG = "false"
  TELEGRAM_WEBHOOK_URL = "https://english-tutor.fly.dev"
  GOOGLE_CREDENTIALS_PATH = "/app/credentials.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[processes]
  # FastAPI HTTP server with Telegram webhook support (auto-starts/stops based on traffic)
  app = "/app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8080"

[deploy]
  release_command = "/app/.venv/bin/alembic upgrade head"

[[vm]]
  vm_size = "shared-cpu-1x"
  cpu_kind = "shared"
  cpus = 1
  memory = 256

[[mounts]]
  source = "media_cache"
  destination = "/app/data"

[[files]]
  guest_path = "/app/credentials.json"
  secret_name = "GOOGLE_CREDENTIALS"
